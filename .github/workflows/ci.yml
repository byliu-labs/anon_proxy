name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ruff check
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.20"

      - name: Run ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"
          version: "0.15.20"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (torch-free base + onnx)
        run: uv sync --extra onnx --dev

      - name: Run tests with coverage gate
        run: uv run pytest -v --cov=anon_proxy --cov-report=term-missing --cov-report=xml --cov-fail-under=70
