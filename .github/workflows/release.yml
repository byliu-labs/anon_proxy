name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  python-artifacts:
    name: Build Python artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist and wheel
        run: uv build

      - name: Extract changelog entry
        run: uv run python anon_proxy/release_notes.py "$GITHUB_REF_NAME"

      - name: Draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.whl

  macos-app:
    name: Build unsigned macOS app
    runs-on: macos-latest
    needs: python-artifacts
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install app dependencies
        run: uv sync --extra onnx --extra menubar --dev

      - name: Build app bundle
        run: uv run --extra onnx --extra menubar anon-proxy-build-app --dest dist --exec-path "/usr/bin/env anon-proxy-menubar"

      - name: Build DMG
        run: |
          mkdir -p dist/dmg-root
          cp -R dist/anon-proxy.app dist/dmg-root/
          hdiutil create \
            -volname "anon-proxy" \
            -srcfolder dist/dmg-root \
            -ov \
            -format UDZO \
            "dist/anon-proxy-${GITHUB_REF_NAME}.dmg"

      - name: Attach DMG to draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/anon-proxy-*.dmg
